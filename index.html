<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 40px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            font-size: 1.1em;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .output-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        
        .output-section.show {
            display: block;
        }
        
        .output-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .summary-text {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            line-height: 1.6;
            color: #333;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #dc3545;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Text Summarizer App</h1>
            <p>Transform long dialogues into concise summaries using AI</p>
        </div>
        
        <div class="content">
            <div class="input-section">
                <label for="dialogue">Enter your text or dialogue:</label>
                <textarea id="dialogue" rows="8" placeholder="Paste your text here..."></textarea>
            </div>
            
            <button onclick="summarizeText()">🔍 Generate Summary</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating summary...</p>
            </div>
            
            <div class="output-section" id="output">
                <div class="output-title">✨ Summary:</div>
                <div class="summary-text" id="summary"></div>
            </div>
        </div>
    </div>
    
    <script>
        async function summarizeText() {
            const dialogue = document.getElementById('dialogue').value;
            
            if (!dialogue.trim()) {
                alert('Please enter some text to summarize.');
                return;
            }
            
            // Show loading, hide output
            document.getElementById('loading').classList.add('show');
            document.getElementById('output').classList.remove('show');
            
            try {
                const response = await fetch('/summarize/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ dialogue: dialogue })
                });
                
                const data = await response.json();
                
                // Hide loading
                document.getElementById('loading').classList.remove('show');
                
                if (data.status === 'success') {
                    document.getElementById('summary').innerHTML = data.summary.replace(/\n/g, '<br>');
                    document.getElementById('output').classList.add('show');
                } else {
                    alert('Error: ' + data.summary);
                }
            } catch (error) {
                document.getElementById('loading').classList.remove('show');
                alert('Error connecting to server. Please make sure the server is running.');
                console.error('Error:', error);
            }
        }
        
        // Allow Enter key (Ctrl+Enter) to submit
        document.getElementById('dialogue').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                summarizeText();
            }
        });
    </script>
</body>
</html>
